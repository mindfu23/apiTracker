<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>API Usage Scraper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      background: #f9fafb;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #111827;
    }
    .provider-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .provider-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      transition: all 0.15s;
    }
    .provider-btn:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .provider-btn.has-data {
      border-color: #10b981;
      background: #ecfdf5;
    }
    .provider-btn.has-error {
      border-color: #f59e0b;
      background: #fffbeb;
    }
    .provider-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: white;
    }
    .provider-info {
      flex: 1;
      text-align: left;
    }
    .provider-name {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }
    .provider-status {
      font-size: 11px;
      color: #6b7280;
    }
    .provider-status.success {
      color: #059669;
    }
    .scrape-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d1d5db;
    }
    .scrape-indicator.active {
      background: #10b981;
    }
    /* Scrape Result Styles */
    .scrape-result {
      font-size: 10px;
      font-weight: 500;
      margin-top: 2px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .scrape-success {
      background: #d1fae5;
      color: #047857;
    }
    .scrape-error {
      background: #fef3c7;
      color: #b45309;
    }
    .scrape-loading {
      background: #e0e7ff;
      color: #4338ca;
      animation: pulse 1.5s infinite;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin: 16px 0 8px;
    }
    .action-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn.primary {
      background: #3b82f6;
      color: white;
    }
    .action-btn.primary:hover {
      background: #2563eb;
    }
    .action-btn.secondary {
      background: #e5e7eb;
      color: #374151;
      margin-top: 8px;
    }
    .action-btn.secondary:hover {
      background: #d1d5db;
    }
    .data-preview {
      margin-top: 12px;
      padding: 10px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .data-row:last-child {
      border-bottom: none;
    }
    .data-label {
      color: #6b7280;
    }
    .data-value {
      font-weight: 500;
      color: #111827;
    }
    .loading {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    /* Page Detection Styles */
    .detection-section {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .detected-known {
      background: #ecfdf5;
      border: 1px solid #10b981;
    }
    .detected-potential {
      background: #fef3c7;
      border: 1px solid #f59e0b;
    }
    .detected-provider {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .detected-hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }
    .detected-potential-page {
      font-size: 12px;
    }
    .mini-btn {
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      margin-top: 6px;
    }
    .mini-btn:hover {
      background: #f3f4f6;
    }
    .mini-btn.danger {
      color: #ef4444;
      border-color: #fecaca;
      padding: 2px 6px;
      font-weight: bold;
    }
    .mini-btn.danger:hover {
      background: #fef2f2;
    }
    /* Custom Pages Styles */
    .custom-pages-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
    }
    .custom-page-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .custom-page-name {
      font-size: 12px;
      font-weight: 500;
    }
    .custom-page-url {
      font-size: 10px;
      color: #6b7280;
    }
    .no-custom-pages {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      padding: 8px;
    }
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .collapsible-header:hover {
      color: #3b82f6;
    }
    .toggle-icon {
      font-size: 10px;
      transition: transform 0.2s;
    }
    .collapsed .toggle-icon {
      transform: rotate(-90deg);
    }
    .collapsible-content {
      max-height: 200px;
      overflow: hidden;
      transition: max-height 0.2s;
    }
    .collapsed .collapsible-content {
      max-height: 0;
    }
  </style>
</head>
<body>
  <h1>API Usage Scraper</h1>

  <!-- Page Detection Section -->
  <div class="detection-section" id="pageDetection" style="display: none;">
    <div id="detectedInfo"></div>
  </div>

  <div class="provider-list" id="providerList">
    <!-- Providers will be populated by JS -->
  </div>

  <div class="section-title">Actions</div>
  <button class="action-btn primary" id="scrapeCurrentBtn">
    Scrape Current Page
  </button>
  <button class="action-btn secondary" id="viewDashboardBtn">
    View Collected Data
  </button>
  <!-- TODO: Future feature - integrate with main API Tracker app
       Currently copies data to clipboard as JSON, but not connected to the app.
       Could be developed to: sync via shared storage, POST to API, or file import.
  <button class="action-btn secondary" id="exportBtn">
    Export to API Tracker
  </button>
  -->

  <div class="data-preview" id="dataPreview" style="display: none;">
    <!-- Data preview will be shown here -->
  </div>

  <!-- Custom Pages Section -->
  <div class="custom-pages-section">
    <div class="section-title collapsible-header" id="customPagesToggle">
      Custom Pages <span class="toggle-icon">▼</span>
    </div>
    <div class="collapsible-content" id="customPagesContent">
      <div id="customPagesList">
        <!-- Custom pages will be populated by JS -->
      </div>
      <button class="mini-btn" id="addCustomPageManual" style="width: 100%; margin-top: 6px;">
        + Add current page
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
